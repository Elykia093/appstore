name: Validate App Store

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "data.yaml"
      - "README.md"
      - "renovate.json"
      - "scripts/**"
      - "mirror.sh"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/**"
      - "data.yaml"
      - "README.md"
      - "renovate.json"
      - "scripts/**"
      - "mirror.sh"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Renovate opens the PR before the version-directory sync commit exists.
    # The synchronize event for that exact updated head runs the full gate.
    if: "${{ github.event_name != 'pull_request' || github.event.action != 'opened' || !startsWith(github.head_ref, 'renovate/') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate app store
        run: python scripts/appstore.py validate

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile maintenance modules
        run: python -m compileall -q scripts

      - name: Validate mirror script syntax
        run: bash -n mirror.sh

      - name: Check whitespace errors
        run: git diff --check
