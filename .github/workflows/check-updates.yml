name: Check App Updates

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a Telegram test notification"
        required: false
        default: false
        type: boolean

concurrency:
  group: check-app-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Check upstream releases and registry digests
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_NOTIFICATION: ${{ inputs.send_test_notification }}
        run: |
          set -o pipefail
          args=(--allow-stale)
          if [[ "$TELEGRAM_TEST_NOTIFICATION" == "true" ]]; then
            args+=(--telegram-test)
          else
            args+=(--notify-telegram)
          fi
          python scripts/check-updates.py "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"

      - name: Notify merged app updates
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python scripts/check-updates.py \
            --notify-merged \
            --before-sha "$BEFORE_SHA" \
            --after-sha "$AFTER_SHA"
